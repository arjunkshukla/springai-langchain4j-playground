spring.application.name=springai-mcp-server
server.port=${MCP_SERVER_PORT:8081}

spring.ai.mcp.server.name=springai-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Provides read-only local resources, a sample text tool, and a reusable document-review prompt.
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false

app.resources.directory=${MCP_RESOURCE_DIRECTORY:./local-resources}
